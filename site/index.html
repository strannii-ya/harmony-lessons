 <div class="gate-art" aria-hidden="true"><div class="motif"><span></span><span></span><span></span><span></span><span></span><b>♮</b></div></div>
 <div class="gate-copy"><div class="brand"><span class="brandmark">h.</span><div>Гармония</div></div>
 <h1>Вход</h1>
 <section class="google-login" aria-label="Способ входа">
 <button id="google-signin" class="google-button" type="button" disabled aria-describedby="google-status"><svg aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M21.8 12.2c0-.7-.1-1.4-.2-2.1H12v3.8h5.5a4.7 4.7 0 0 1-2 3.1c-1 .6-2.2.9-3.5.9a6 6 0 1 1 4.1-10.4l2.9-2.8A10 10 0 1 0 12 22c2.7 0 5-.9 6.7-2.5 1.9-1.8 3.1-4.3 3.1-7.3Z"/></svg>Войти через Google</button>
 <button id="yandex-signin" class="google-button yandex-button" type="button" disabled aria-describedby="google-status"><span class="yandex-mark" aria-hidden="true">Я</span>Войти через Яндекс</button>
 <label class="remember-label"><input type="checkbox" id="remember">Запомнить на этом устройстве</label>
 <p id="google-status" class="google-note" role="status" aria-live="polite"></p>
 </section>
 <details class="email-fallback"><summary>Вход по почте</summary>
 <form id="login-form"><label for="email">Электронная почта</label><input id="email" type="email" autocomplete="email" placeholder="Твой email" required maxlength="254"><button class="primary" id="send" type="submit">Получить письмо</button></form>
 <form id="code-form" hidden><label for="code">Код или ссылка из письма</label><div class="inline"><input id="code" type="text" autocomplete="one-time-code" autocapitalize="off" spellcheck="false" placeholder="Код или скопированная ссылка" minlength="6" maxlength="4096" required><button class="primary" type="submit">Войти</button></div><p class="auth-help">Код и ссылку вводи только здесь, не отправляй в чат.</p></form>
 </details><p id="login-status" class="notice" role="status"></p>
 </div>
</section>

 <div class="workspace"><header class="topbar"><button id="menu" aria-label="Открыть навигацию">☰</button><div id="breadcrumb">Мой курс</div><div class="top-actions"><button id="focus" title="Режим занятия">Скрыть меню</button></div></header><main id="content" tabindex="-1"></main></div>
 <section id="player" class="player" aria-label="Проигрыватель" hidden><div class="player-title"><span class="tiny-dot"></span><div id="playing-title"></div></div><button id="play-toggle" class="play-circle" aria-label="Играть">▶</button><label class="tempo-label">Темп <input id="tempo" type="range" min="36" max="160" value="72"><output id="tempo-value">72</output></label><label class="compact">Руки<select id="hand"><option value="both">Обе</option><option value="left">Бас</option><option value="right">Правая</option></select></label><button id="loop" aria-pressed="false" title="Повторять">↻</button><button id="close-player" aria-label="Остановить и закрыть">×</button></section>
