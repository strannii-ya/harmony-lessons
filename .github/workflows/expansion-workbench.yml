name: Prepare expansion workbench
on:
  push:
    branches: [reference-genres]
    paths: [.github/workflows/expansion-workbench.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:engraving
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=ui-results --exclude=workbench.tar -cf workbench.tar .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expansion-workbench
          path: workbench.tar
          retention-days: 1
