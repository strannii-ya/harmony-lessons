name: Verify authentication UX
on:
  push:
    branches: [auth-session-ux, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: auth-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  auth-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check all musical and security models
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:engraving
          npm test
          npm run build
      - name: Install pinned test browsers
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium webkit > /tmp/auth-ux-browsers.log 2>&1 || { tail -60 /tmp/auth-ux-browsers.log; exit 1; }
      - name: Verify session renewal, loading states, brand icon and disclosure headings
        run: python tests/auth_ux_smoke.py
      - name: Preserve existing Google and Yandex login behavior
        run: |
          python tests/google_smoke.py
          python tests/yandex_smoke.py
      - name: Verify responsive layout
        run: python tests/mobile_smoke.py
      - name: Save synthetic previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auth-ux-checks
          path: ui-results
          retention-days: 7
