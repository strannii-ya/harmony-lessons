name: Engraving workbench
on:
  push:
    branches: [engraving-vexflow]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare pinned vector engraving library and public source
        run: |
          mkdir -p /tmp/engraving-workbench/source /tmp/engraving-workbench/vendor
          git archive HEAD | tar -x -C /tmp/engraving-workbench/source
          npm install --prefix /tmp/engraving-deps --ignore-scripts --no-audit --no-fund --save-exact vexflow@4.2.5
          cp /tmp/engraving-deps/package*.json /tmp/engraving-workbench/vendor/
          cp -R /tmp/engraving-deps/node_modules/vexflow/build /tmp/engraving-workbench/vendor/
          cp /tmp/engraving-deps/node_modules/vexflow/LICENSE /tmp/engraving-workbench/vendor/
          find /tmp/engraving-workbench -type f \( -name '*.woff*' -o -name '*.ttf' -o -name '*.otf' -o -name '*.map' \) -delete
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engraving-workbench
          path: /tmp/engraving-workbench
          retention-days: 1
