name: Verify and publish harmony notebook
on:
  push:
    branches: [main, engraving-vexflow, auth-yandex, rh-voicings, reference-genres]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install integrity-pinned vector engraving engine without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:engraving
      - name: Test music model and public boundary
        run: npm test
      - name: Build public interface only
        run: npm run build
      - name: Install pinned browser test tools
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium webkit > /tmp/playwright-install.log 2>&1 || { tail -80 /tmp/playwright-install.log; exit 1; }
      - name: Verify Google and Yandex login with synthetic providers
        run: python tests/yandex_smoke.py
      - name: Verify deployed Yandex adapter rejects unauthenticated requests
        if: github.event_name != 'pull_request'
        run: python scripts/verify-yandex-endpoint.py
      - name: Verify light theme and portrait and landscape phones
        run: python tests/mobile_smoke.py
      - name: Verify Google PKCE and remembered sessions with synthetic fixtures
        run: python tests/google_smoke.py
      - name: Verify complete scores and responsive reflow
        run: python tests/score_smoke.py
      - name: Verify separate chord guide and private theory
        run: python tests/engraving_smoke.py
      - name: Verify owner invitations and member isolation in the interface
        run: python tests/access_smoke.py
      - name: Verify per-card bass staves and directed bass motion
        run: python tests/bass_smoke.py
      - name: Verify Bravura paths, pitch identity, accidentals and engraver geometry
        run: python tests/vexflow_smoke.py
      - name: Verify connected right-hand voicings and academic key labels
        run: python tests/voicings_smoke.py
      - name: Verify extended reference and private genre collection
        run: python tests/library_smoke.py
      - name: Upload browser screenshots (synthetic data only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-interface-checks
          path: ui-results
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy public interface
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify files actually served by GitHub Pages
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['PAGES_URL'].rstrip('/')+'/'
          expected=os.environ['EXPECTED_COMMIT']
          def read(path):
              req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  return response.read().decode('utf-8')
          for attempt in range(8):
              try:
                  status=json.loads(read('version.json?verify='+expected))
                  assert status['commit']==expected, 'Pages is still serving a different commit'
                  version=status['version']
                  html=read('?verify='+expected)
                  assert './light.css?v='+version in html
                  assert './access.css?v='+version in html
                  assert 'data-view="reference"' in html
                  assert 'data-view="access"' in html
                  assert 'id="midi"' not in html
                  assert 'id="google-signin"' in html and 'id="yandex-signin"' in html
                  oauth=read('oauth-session.js?v='+version)
                  assert 'custom:yandex' in oauth and 'login:email' in oauth and 'yandexUrl' in oauth
                  app=read('app.js?v='+version)
                  assert 'data-zoom=' not in app and 'data-download=' not in app
                  assert 'mountAccess' in app and 'data-bass=' in app and 'data-voicing=' in app
                  assert 'planRightHand' in read('voicings.js?v='+version)
                  assert 'ACADEMIC_ROOTS' in read('key-labels.js?v='+version)
                  assert 'invite-form' in read('access.js?v='+version)
                  assert 'listAccess' in read('api.js?v='+version)
                  assert 'data-inversion' in read('chord-guide.js?v='+version)
                  assert 'data-guide-category' in read('chord-guide.js?v='+version)
                  assert 'thirteenthFlat9' in read('chord-types.js?v='+version)
                  assert 'data-collection' in app and 'genre-filter' in app
                  assert 'library.css?v='+version in html
                  notation=read('notation.js?v='+version)
                  assert 'vexflow-bravura' in notation and 'planEngraving' in notation
                  assert "node('ellipse'" not in notation
                  assert 'VexFlow 4.2.5' in read('vendor/vexflow-bravura.js?v='+version)
                  assert 'bass_offsets' in read('bass.js?v='+version)
                  print('Verified live GitHub Pages:',base)
                  print('Published commit:',status['commit'])
                  print('Published asset version:',version)
                  break
              except Exception as exc:
                  if attempt==7:raise
                  print('Waiting for Pages propagation:',str(exc))
                  time.sleep(8)
          PY
