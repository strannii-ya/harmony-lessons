name: Prepare modes reference workbench
on:
  push:
    branches: [reference-modes]
    paths: [.github/workflows/modes-workbench.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:engraving
          tar -czf /tmp/modes-source.tar.gz site scripts tests package.json package-lock.json .github README.md THIRD_PARTY_NOTICES.md supabase .gitignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modes-workbench
          path: /tmp/modes-source.tar.gz
          retention-days: 1
