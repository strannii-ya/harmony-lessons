name: Prepare right-hand voicing workbench
on:
  push:
    branches: [rh-voicings]
    paths: [.github/workflows/voicing-workbench.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive reviewed public source without credentials
        run: |
          mkdir -p /tmp/voicing-workbench/source
          git archive HEAD | tar -x -C /tmp/voicing-workbench/source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voicing-workbench
          path: /tmp/voicing-workbench
          include-hidden-files: true
          retention-days: 1
