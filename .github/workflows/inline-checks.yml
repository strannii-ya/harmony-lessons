name: Verify inline card playback
on:
  push:
    branches: [ui-inline-cards]
permissions:
  contents: read
concurrency:
  group: inline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build and test public interface
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:engraving
          npm test
          npm run build
      - name: Install pinned browsers
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium webkit > /tmp/inline-browsers.log 2>&1 || { tail -60 /tmp/inline-browsers.log; exit 1; }
      - name: Verify playback, notation and all reference screens
        run: |
          failed=0
          for test in inline controls card_layout voicings bass modes library paper mobile engraving; do
            python tests/${test}_smoke.py > /tmp/${test}.log 2>&1 || failed=1
            tail -55 /tmp/${test}.log
          done
          exit "$failed"
      - name: Save reviewed source workbench
        if: always()
        run: |
          mkdir -p workbench
          git archive HEAD > workbench/source.tar
          test ! -d site/vendor || tar -rf workbench/source.tar site/vendor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inline-workbench
          path: |
            workbench/source.tar
            ui-results
          retention-days: 3
