name: Verify card layout
on:
  push:
    branches: [style-card-layout, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: cards-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check musical models and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:engraving
          npm test
          npm run build
      - name: Install pinned browsers
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium webkit > /tmp/card-browsers.log 2>&1 || { tail -60 /tmp/card-browsers.log; exit 1; }
      - name: Verify card footers, header favorites and four-bar phone phrases
        run: python tests/card_layout_smoke.py
      - name: Preserve score controls and white paper surfaces
        run: |
          python tests/controls_smoke.py
          python tests/paper_smoke.py
      - name: Save synthetic previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: card-layout-checks
          path: ui-results/cards-*
          retention-days: 7
