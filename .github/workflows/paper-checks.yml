name: Verify paper surfaces
on:
  push:
    branches: [style-paper, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build and check all musical models
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:engraving
          npm test
          npm run build
      - name: Install pinned browsers
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium webkit > /tmp/paper-browsers.log 2>&1 || { tail -60 /tmp/paper-browsers.log; exit 1; }
      - name: Verify whole-note scales and paper surfaces
        run: python tests/paper_smoke.py
      - name: Save synthetic previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-interface-checks
          path: ui-results/paper-*.png
          retention-days: 7
