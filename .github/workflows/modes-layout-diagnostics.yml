name: Diagnose mode layout
on:
  push:
    branches: [reference-modes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: modes-layout-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps webkit > /tmp/modes-webkit-install.log 2>&1 || { tail -60 /tmp/modes-webkit-install.log; exit 1; }
      - name: Isolate scroll overflow using synthetic accounts
        run: python tests/modes_layout_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: modes-layout-diagnostics
          path: ui-results/modes-overflow-probe.*
          retention-days: 3
